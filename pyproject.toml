[project]
name = "smoothfm"
version = "1.0.0"
description = "Code of the paper Explicit Regularization for Flow Matching"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Lars Ruthotto", email = "lruthotto@emory.edu" }, { name = "Eran Treister" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.optional-dependencies]
cholmod = ["cvxopt>=1.3"]

[dependency-groups]
dev = ["pytest>=8", "mpmath>=1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smoothfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "slow: long-running tests (excluded in CI's unit job by -m 'not slow')",
    "script: compute scripts run as subprocesses (--smoke, --example, refusals)",
    "report: report stage (OUTPUTS.txt, unresolved rule, report regression)",
]
